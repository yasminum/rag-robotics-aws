name: CI - Validate scripts

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyyaml

      - name: Lint Python (no fail on style)
        continue-on-error: true
        run: |
          flake8 scripts/ --max-line-length=120 --extend-ignore=E203,W503,E501 || true

      - name: Validate Python syntax (must pass)
        run: |
          for f in scripts/*.py lambda/*.py; do
            if [ -f "$f" ]; then
              python -m py_compile "$f" && echo "OK: $f"
            fi
          done

      - name: Validate bash syntax
        run: |
          for f in scripts/*.sh; do
            if [ -f "$f" ]; then
              bash -n "$f" && echo "OK: $f"
            fi
          done

      - name: Validate PowerShell syntax
        run: |
          # Validación básica de sintaxis PowerShell sin ejecutar
          for f in scripts/*.ps1; do
            if [ -f "$f" ]; then
              # Verifica que el archivo no esté vacío y tenga estructura básica
              if [ -s "$f" ]; then
                echo "OK: $f (size $(wc -c < "$f") bytes)"
              else
                echo "FAIL: $f está vacío"
                exit 1
              fi
            fi
          done

      - name: Validate YAML files
        run: |
          python -c "
          import yaml
          import sys

          class CFNLoader(yaml.SafeLoader): pass
          def construct_undefined(loader, suffix, node):
              if isinstance(node, yaml.ScalarNode): return loader.construct_scalar(node)
              elif isinstance(node, yaml.SequenceNode): return loader.construct_sequence(node)
              elif isinstance(node, yaml.MappingNode): return loader.construct_mapping(node)
          CFNLoader.add_multi_constructor('!', construct_undefined)

          files = [
              'infra/knowledge_base.yaml',
              '.github/workflows/validate.yml',
              'lambda/trigger_s3.yaml'
          ]
          for f in files:
              try:
                  with open(f) as fp:
                      yaml.load(fp, Loader=CFNLoader)
                  print(f'OK: {f}')
              except FileNotFoundError:
                  print(f'SKIP: {f} (no existe)')
              except Exception as e:
                  print(f'FAIL: {f}: {e}')
                  sys.exit(1)
          "

      - name: Check for AWS secrets
        run: |
          # Buscar Access Key IDs de AWS (formato AKIA seguido de 16 chars alfanuméricos)
          if grep -rE "AKIA[0-9A-Z]{16}" scripts/ lambda/ infra/ docs/ README.md 2>/dev/null; then
            echo "FAIL: Se encontró un Access Key ID de AWS en el código"
            exit 1
          fi

          # Buscar Secret Access Keys asignados
          if grep -rE "aws_secret_access_key\s*=\s*['\"][a-zA-Z0-9/+=]{40}['\"]" \
              scripts/ lambda/ infra/ docs/ 2>/dev/null; then
            echo "FAIL: Se encontró un Secret Access Key en el código"
            exit 1
          fi

          # Buscar archivos .pem referenciados como strings
          if grep -rE "-----BEGIN.*PRIVATE KEY-----" scripts/ lambda/ infra/ docs/ 2>/dev/null; then
            echo "FAIL: Se encontró una clave privada en el código"
            exit 1
          fi

          echo "OK: No se encontraron credenciales comprometidas"

      - name: Verify required folders exist
        run: |
          for folder in scripts diagrams; do
            if [ -d "$folder" ]; then
              echo "OK: $folder/ existe"
            else
              echo "FAIL: $folder/ no existe"
              exit 1
            fi
          done
          # Estas carpetas son opcionales pero recomendadas
          for folder in docs infra lambda; do
            if [ -d "$folder" ]; then
              echo "OK: $folder/ existe"
            else
              echo "WARN: $folder/ no existe (recomendado crearla)"
            fi
          done
